version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - revive
    - unconvert
    - unparam
  settings:
    misspell:
      locale: US
    gosec:
      excludes:
        - G115 # integer conversions are bounds-checked by hand in the parsers
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, unparam]
formatters:
  enable:
    - gofmt
